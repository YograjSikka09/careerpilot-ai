spring.application.name=careerpilot-ai
server.port=${PORT:8080}
server.error.include-message=always

# Database Configuration (local default is persistent H2; override with DB_URL for MySQL / Railway)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/careerpilot}
spring.datasource.username=${DB_USER:${DB_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Security & JWT (reads JWT_SECRET from environment or defaults)
jwt.secret=${JWT_SECRET:careerpilot-change-this-secret-before-production-2026}
app.jwt.secret=${JWT_SECRET:${jwt.secret:careerpilot-change-this-secret-before-production-2026}}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# File Uploads (auto-creates folder; note host ephemeral disk may reset on redeploy)
app.upload.dir=${UPLOAD_DIR:./uploads}

# AI Matching Service
app.ai.url=${AI_SERVICE_URL:http://localhost:8001}
app.seed.enabled=${SEED_DATA:true}
